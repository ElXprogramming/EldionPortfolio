name: Keep Supabase Database Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (Supabase free projects pause after 7 days of inactivity)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "⚠️ Warning: SUPABASE_URL and SUPABASE_ANON_KEY must be set in GitHub Secrets."
            exit 1
          fi

          case "$SUPABASE_URL" in
            https://*.supabase.co|https://*.supabase.co/) ;;
            *)
              echo "❌ Invalid SUPABASE_URL format. Must match https://*.supabase.co"
              exit 1
              ;;
          esac

          TARGET_URL="${SUPABASE_URL%/}/rest/v1/rpc/ping_keep_alive"
          echo "Pinging Supabase Keep-Alive RPC endpoint..."

          HTTP_STATUS=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{}" \
            "$TARGET_URL")

          echo "Supabase HTTP response status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Successfully pinged Supabase! Inactivity timer has been reset."
          elif [ "$HTTP_STATUS" -eq 404 ]; then
            echo "⚠️ PostgREST is reachable (timer reset), but RPC 'ping_keep_alive' is not yet installed."
          else
            echo "❌ Unexpected response ($HTTP_STATUS). Database might be paused or credentials are invalid."
            exit 1
          fi
