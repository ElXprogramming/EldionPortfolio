name: Keep Supabase Database Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (Supabase free projects pause after 7 days of inactivity)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://dntvghdlynxhtqglvmne.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "⚠️ Warning: SUPABASE_ANON_KEY (or VITE_SUPABASE_ANON_KEY) is not set in GitHub Secrets."
            echo "To enable automated pings:"
            echo "1. Go to repository Settings -> Secrets and variables -> Actions"
            echo "2. Add 'VITE_SUPABASE_ANON_KEY' (and optionally 'VITE_SUPABASE_URL') from your .env.local"
            exit 1
          fi

          TARGET_URL="${SUPABASE_URL%/}/rest/v1/contact_messages?select=id&limit=1"
          echo "Pinging: $TARGET_URL"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$TARGET_URL")

          echo "Supabase HTTP response status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Successfully pinged Supabase! Inactivity timer has been reset."
          elif [ "$HTTP_STATUS" -eq 404 ]; then
            echo "⚠️ PostgREST is reachable, but table 'contact_messages' was not found."
            echo "The database received traffic and is kept alive, but make sure to run the SQL migration."
          else
            echo "❌ Unexpected response ($HTTP_STATUS). Database might still be paused or keys are invalid."
            exit 1
          fi
